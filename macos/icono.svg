<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Radar de Licitaciones</title>
  <!-- La única fuente del icono. `herramientas/construir_app.py` lo rasteriza con
       `sips` a los tamaños que pide macOS y lo empaqueta con `iconutil`; las dos
       vienen con el sistema, así que no hace falta instalar nada ni guardar un PNG
       binario por tamaño en el repositorio.

       El comentario va DENTRO del <svg> y no encima: `sips` no sabe leer un fichero
       que empiece por un comentario XML y falla con «Error 13: an unknown error
       occurred», que no ayuda lo más mínimo a averiguar por qué.

       Un radar con la paleta de Zepo, para que en el Dock se vea de la misma casa que
       Zepo Desk: el degradado navy → azul eléctrico de su logo, los barridos en
       blanco y el contacto en el turquesa de la marca. Es el mismo dibujo que el logo
       de la barra lateral (`index.html`), a otra escala. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A3270"/>
      <stop offset="1" stop-color="#142CD1"/>
    </linearGradient>
  </defs>

  <!-- 180 de radio es el «squircle» que macOS espera en un icono de 1024. -->
  <rect width="1024" height="1024" rx="180" fill="url(#fondo)"/>

  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <circle cx="512" cy="512" r="318" stroke-width="20" opacity=".22"/>
    <circle cx="512" cy="512" r="224" stroke-width="20" opacity=".38"/>
    <circle cx="512" cy="512" r="130" stroke-width="20" opacity=".58"/>
    <!-- Las cruces del centro, cortadas para no tapar los barridos. -->
    <path d="M512 148v104M512 772v104M148 512h104M772 512h104" stroke-width="20" opacity=".4"/>
    <!-- El barrido: la línea que en un radar de verdad está girando. -->
    <path d="M512 512 L760 316" stroke-width="28"/>
  </g>
  <circle cx="512" cy="512" r="26" fill="#ffffff"/>

  <!-- El contacto, en turquesa: es lo único que el radar ha encontrado. -->
  <circle cx="760" cy="316" r="100" fill="none" stroke="#7BE9E4" stroke-width="16" opacity=".45"/>
  <circle cx="760" cy="316" r="64" fill="#7BE9E4"/>
</svg>
